[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tempo-cli"
version = "0.1.0"
description = "Simple CLI for Tempo Timesheets time tracking"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "requests>=2.28",
    "tabulate>=0.9",
]

[tool.setuptools.packages.find]
include = ["tempo_cli*"]

[project.scripts]
tempo = "tempo_cli.cli:cli"
